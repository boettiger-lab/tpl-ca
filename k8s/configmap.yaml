# LLM config template — NO SECRETS.
#
# The PROXY_KEY lives only in the nginx config (see `tpl-ca-nginx`
# below), which injects the Authorization header server-side via
# `proxy_set_header`. The browser only sees a relative `/api/llm`
# endpoint and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: schmidtdse
  name: tpl-ca-config
data:
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_endpoint": "/api/llm"
    }

---
# Nginx configuration — reverse-proxies /api/llm/ to open-llm-proxy and
# injects the Authorization header from ${PROXY_KEY} at container start.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: schmidtdse
  name: tpl-ca-nginx
data:
  nginx.conf.template: |
    include /etc/nginx/glen/limits.conf;

    server {
        listen 80;
        server_name _;

        include /etc/nginx/glen/base.conf;
        include /etc/nginx/glen/llm.conf;
        include /etc/nginx/glen/mcp.conf;
        include /etc/nginx/glen/spa.conf;
    }
